[package]
name = "fastener_workbench"
version = "1.0.10"
description = "紧固件贸易工作台 (Tauri 桌面封装)"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "fastener_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "gzip"] }
tokio = { version = "1", features = ["rt-multi-thread", "io-util", "time", "macros"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
