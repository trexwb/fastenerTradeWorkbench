# ═══════════════════════════════════════════════════════════════════
# 紧固件贸易工作台 — 在线版（浏览器版）部署到 GitHub Pages
# ───────────────────────────────────────────────────────────────────
# 触发：main 分支推送 或 手动 workflow_dispatch（可选任意分支）
# 做了什么：
#   1. npm ci + npm run vite:build 生成 dist/（与 Tauri 桌面版同一套
#      构建；vite.config.js 的 base:'./' 保证资源为相对路径，
#      GitHub Pages 子路径（/fastenerTradeWorkbench/）下可正确加载）
#   2. 将 dist/ 部署到 GitHub Pages
# 部署后访问地址以仓库 Settings → Pages 显示为准。
# ⚠️ 不要改用 scripts/copy-frontend.mjs 生成 dist：该脚本面向旧版
#    单文件结构（src/css|js|images），项目迁移 Vue3+Vite 后已不适用，
#    产物残缺且 index.html 仍引用根路径 /main.js 导致 404。
#
# ⚠️ 首次使用需在仓库 Settings → Pages → Build and deployment →
#    Source 选择 "GitHub Actions"（一次性配置）
#
# 说明：在线版与桌面版数据相互独立（在线版数据存访问者浏览器
#   IndexedDB）。
# ═══════════════════════════════════════════════════════════════════

name: Deploy Web Version to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署任务，新推送会取消进行中的
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: 生成 dist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建前端产物（vite build，base './' 相对路径）
        run: npm run vite:build

      - name: 验证 dist 产物
        run: |
          ls -la dist/ && test -f dist/index.html && test -f dist/assets/js/index.js
          grep -q 'src="./assets/js/index.js"' dist/index.html && echo "资源路径为相对路径，自检通过"

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: 部署到 GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v5
