function sourceItem(idx){
  const it=_fItems[idx];
  const remain=it.qty-itemAllocSum(it);
  const body=buildSourceDrawerBody(idx);
  openDrawer('寻货 · '+escHtml(it.diameter||'')+' '+escHtml(it.type||'')+(remain>0?'（剩余 '+fmtN(remain)+' 待寻）':'（已满量）'),body,null,true,true);
}

function addMatchSupplier(idx,priceId,q){
  const it=_fItems[idx];
  const p=DB.prices.find(x=>x.id===priceId);
  if(!p)return;
  // q 由 submitPriceMatch 预传；若未传则从 DOM 读取（兼容旧的单独添加路径）
  if(q===undefined) q=+document.getElementById('alloc_'+priceId).value;
  const allocSum=itemAllocSum(it);
  const remain=it.qty-allocSum;
  if(!(q>0)){toast('请输入有效分配数量','warning');return;}
  if(q>remain){toast('分配数量超出剩余量 '+fmtN(remain),'warning');return;}
  // 检查是否已存在该供应商
  if(itemOpts(it).some(o=>o.supplierId===p.unitId)){toast('该供应商已添加','warning');return;}
  it.options=it.options||[];
  it.options.push({id:uid('Q'),supplierId:p.unitId,contact:p.contact||'',price:p.price,allocQty:q,stockNote:'有效期:'+p.validFrom,source:'priceLibrary',status:'已选'});
  saveOrderDraftFromItems();
  persistSourcingFromDetail();
  persistOrderItems();
  refreshSourceDrawer(idx);updateDetailRow(idx);if(_fMode==='edit')refreshProductList();
  toast('已添加供应商：'+pName(p.unitId)+' · 分配 '+fmtN(q),'success');
}

function manualSupplier(idx){
  const it=_fItems[idx];
  const nameVal=document.getElementById('ms_name').dataset.val;
  const nameInput=document.getElementById('ms_name').querySelector('input').value.trim();
  const name=nameVal&&nameVal!==nameInput?pName(nameVal):(nameVal||nameInput);
  const contact=document.getElementById('ms_contact').value.trim();
  const phone=document.getElementById('ms_phone').value.trim();
  const price=+document.getElementById('ms_price').value;
  const q=+document.getElementById('ms_qty').value;
  const stock=document.getElementById('ms_stock').value.trim();
  const errEl=document.getElementById('msErr');

  if(!name){errEl.style.display='block';errEl.textContent='请输入供应商名称';return;}
  if(!(price>0)){errEl.style.display='block';errEl.textContent='请输入有效采购单价';return;}
  if(!(q>0)){errEl.style.display='block';errEl.textContent='请输入有效分配数量';return;}
  const allocSum=itemAllocSum(it);
  if(allocSum+q>it.qty){errEl.style.display='block';errEl.textContent='累计分配数量超出需求 '+fmtN(it.qty)+'（已分配 '+fmtN(allocSum)+'）';return;}
  // 检查是否已存在该供应商
  if(itemOpts(it).some(o=>o.supplierId===nameVal||(pName(o.supplierId)===name))){errEl.style.display='block';errEl.textContent='该供应商已添加，请勿重复';return;}

  // 查找或创建关联单位
  let unit=DB.units.find(u=>u.name===name||(u.id===nameVal));
  if(!unit&&nameVal){
    unit=DB.units.find(u=>u.id===nameVal);
  }
  if(!unit){
    unit={id:uid('U'),name,roles:['供应商'],term:'',rating:'新客',contacts:[]};
    if(contact||phone){
      unit.contacts.push({name:contact||'联系人',phone:phone||'',side:'供应商'});
    }
    DB.units.push(unit);
    toast('已自动创建关联单位：'+name,'success');
  }else{
    if(!unit.roles.includes('供应商')){
      unit.roles.push('供应商');
    }
    // 新增联系人或更新已有联系人（同名但不同电话则更新）
    if(contact){
      const exist=unit.contacts.find(c=>c.name===contact);
      if(exist){
        if(phone&&exist.phone!==phone){
          exist.phone=phone;  // 更新电话号码
          toast('联系人「'+contact+'」电话号码已更新','info');
        }
      }else{
        unit.contacts.push({name:contact,phone:phone||'',side:'供应商'});
      }
    }else if(phone){
      // 无姓名时，追加一个新联系人记录（避免电话相同则忽略）
      unit.contacts.push({name:'联系人',phone,side:'供应商'});
    }
  }

  // 自动写入价格库（防重复）
  const priceAttrs={type:it.type,standard:it.standard,diameter:it.diameter,hardness:it.hardness,surface:it.surface,material:it.material};
  if(isPriceDuplicate(unit.id,it.bomSku||'',it.spec||'',priceAttrs,null)){
    toast('价格库中已存在相同供应商+SKU+规格+属性的报价，本次跳过写入','info');
  }else{
    DB.prices.push({
      id:uid('PR'),unitId:unit.id,contact:contact||'',
      type:it.type,standard:it.standard,diameter:it.diameter,
      hardness:it.hardness,surface:it.surface,material:it.material,
      spec:it.spec||'',bomSku:it.bomSku||'',
      price,validFrom:today(),remark:stock,createdAt:today()
    });
  }
  saveDB();

  // 添加到 options
  it.options=it.options||[];
  it.options.push({id:uid('Q'),supplierId:unit.id,contact:contact||'',price,allocQty:q,stockNote:stock,source:'manual',status:'已选'});

  saveOrderDraftFromItems();
  persistSourcingFromDetail();
  persistOrderItems();
  refreshSourceDrawer(idx);closeModal();updateDetailRow(idx);if(_fMode==='edit')refreshProductList();
  toast('已添加供应商 '+name+' · 分配 '+fmtN(q),'success');
}

function removeOption(idx,optId){
  const it=_fItems[idx];
  it.options=(it.options||[]).filter(o=>o.id!==optId);
  saveOrderDraftFromItems();
  persistSourcingFromDetail();
  persistOrderItems();
  refreshSourceDrawer(idx);updateDetailRow(idx);if(_fMode==='edit')refreshProductList();
  toast('已移除该供应商分配','info');
}

/* ---- 保存订单 ---- */
async function saveOrder(){
  const buyerId=document.getElementById('tf_buyer').dataset.val;
  if(!buyerId){toast('请选择采购商','warning');return;}
  if(!_fItems.length){toast('请至少添加一条产品明细','warning');return;}
  const delivery=document.getElementById('tf_delivery').value;
  if(!delivery){toast('请选择交货期','warning');return;}
  const buyerContact=document.getElementById('tf_contact').value;
  const project=document.getElementById('tf_project').value;
  const status=document.getElementById('tf_status').value;
  if(!ORDER_STATUSES.includes(status)){toast('无效的订单状态','error');return;}
  const remark=document.getElementById('tf_remark').value;

  if(_fMode==='edit'&&_fOrderId){
    const o=DB.orders.find(x=>x.id===_fOrderId);
    if(o){
      o.buyerId=buyerId;o.buyerContact=buyerContact;o.project=project;
      o.delivery=delivery;o.status=status;o.remark=remark;
      o.items=_fItems.map(it=>({...it}));
      o.updatedAt=now();
      clearDraft(DRAFT_TYPES.order);
      await saveDB();
      toast('订单已保存','success');
      curOrder=null;curOrderView=_fOrderId;render();return;
    }
  }
  // 使用 orderSeq 独立序号生成器，避免删除订单后序号重复
  DB.orderSeq=(DB.orderSeq||1);
  const seq=DB.orderSeq;
  DB.orderSeq=seq+1;
  const id='PO'+today().slice(2,4)+today().slice(5,7)+today().slice(8,10)+'-'+String(seq).padStart(3,'0');
  const o={id,buyerId,buyerContact,project,delivery,status,remark,items:_fItems.map(it=>({...it})),createdAt:now()};
  DB.orders.push(o);
  clearDraft(DRAFT_TYPES.order);
  await saveDB();
  toast('订单已创建：'+id,'success');
  curOrder=null;curOrderView=id;render();
}

function exportOrdersCSV(){
  const headers=['订单号','采购商','项目','交货日期','状态','利润','产品类型','属性','材料','硬度','表面处理','数量(千支)','销售单价(元/千支)','采购单价(元/千支)','单位利润(元/千支)','供应商','联系人','寻源状态'];
  const rows=[];
  DB.orders.forEach(o=>{
    const buyer=pName(o.buyerId);
    const profit=o.status==='完成'||o.items.every(i=>isItemSourced(i))?orderProfit(o):'';
    o.items.forEach(it=>{
      (it.options||[]).forEach(opt=>{
        rows.push([
          o.id,buyer,o.project||'',o.delivery,o.status,fmt(profit),
          it.type||'',[it.standard,it.diameter,it.surface].filter(Boolean).join(' '),
          it.material||'',it.hardness||'',it.surface||'',
          opt.allocQty||it.qty||'',it.salePrice||'',opt.price||'',
          fmt((it.salePrice||0)-(opt.price||0)),
          pName(opt.supplierId),opt.contact||'',opt.status||''
        ]);
      });
      // 无供应商的行
      if(!(it.options&&it.options.length)){
        rows.push([
          o.id,buyer,o.project||'',o.delivery,o.status,fmt(profit),
          it.type||'',[it.standard,it.diameter,it.surface].filter(Boolean).join(' '),
          it.material||'',it.hardness||'',it.surface||'',
          it.qty||'',it.salePrice||'','','','','',''
        ]);
      }
    });
  });
  const csv=[headers,...rows].map(r=>r.map(v=>'"'+String(v||'').replace(/"/g,'""')+'"').join(',')).join('\n');
  const bom='\uFEFF';  // UTF-8 BOM
  const blob=new Blob([bom+csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='紧固件贸易订单明细_'+today()+'.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('已导出 '+rows.length+' 条订单明细到 CSV','success');
}

function importJSON(event){
  const file=event.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const data=JSON.parse(e.target.result);
      if(!data.units||!data.prices||!data.orders){
        toast('文件格式不正确，缺少必要字段','error');
        return;
      }
      // 数据完整性校验
      if(!Array.isArray(data.units)||!data.units.every(u=>u&&u.id&&u.name)){
        toast('数据校验失败：关联单位数据不完整（缺少id或name）','error');
        return;
      }
      if(!Array.isArray(data.prices)){
        toast('数据校验失败：价格数据格式错误','error');
        return;
      }
      if(!Array.isArray(data.orders)){
        toast('数据校验失败：订单数据格式错误','error');
        return;
      }
      confirmModal('导入将覆盖当前所有数据，确认继续?',async ()=>{
        DB=data;
        if(!DB.specs)DB.specs=JSON.parse(JSON.stringify(DEFAULT_SPECS));
        if(!DB.bom)DB.bom=[];
        if(!DB.seq)DB.seq=100;
        // 旧版数据没有 orderSeq，需要从现有订单号中推算最大序号
        if(!DB.orderSeq){
          const maxSeq=DB.orders.reduce((max,o)=>{
            const m=o.id.match(/PO\d{8}-(\d+)/);
            return m?Math.max(max,parseInt(m[1],10)):max;
          },1);
          DB.orderSeq=maxSeq+1;
        }
        migrateItems();
        await saveDB();closeModal();render();
        toast('数据已导入：'+DB.orders.length+' 订单、'+DB.prices.length+' 价格、'+DB.units.length+' 单位','success');
      },'确认导入');
    }catch(err){
      toast('文件解析失败：'+err.message,'error');
    }
  };
  reader.readAsText(file);
  event.target.value='';
}

    DB={units:[],specs:JSON.parse(JSON.stringify(DEFAULT_SPECS)),bom:[],prices:[],orders:[],seq:100,orderSeq:1};
    saveDB();render();
    toast('全部数据已清空','info');
  },'确认清空','取消');
}

/* =========================================================
   绑定视图事件
   ========================================================= */
function bindView(){
  // 数据管理页：异步更新存储配额显示
  if(view==='data'){setTimeout(updateStorageQuota,100);}
  // 属性管理页：绑定新增输入框
  if(view==='specs'){
    SPEC_FIELDS.forEach(k=>{
      const el=document.getElementById('specadd_'+k);
      if(!el||el.dataset.bound)return;
      el.dataset.bound='1';
      combo(el,(DB.specs[k]||[]).map(v=>({id:v,label:v})),opt=>{
        // 新增值
        if(opt.isCustom||!DB.specs[k].includes(opt.id)){
          if(!DB.specs[k])DB.specs[k]=[];
          if(!DB.specs[k].includes(opt.id)){
            DB.specs[k].push(opt.id);
            saveDB();
            toast(SPEC_LABELS[k]+'已添加：'+opt.id,'success');
            render();
          }
        }
      },'输入新值后回车...',true);
    });
    return;
  }
  // 报价管理页：绑定筛选 combo
  if(view==='prices'){
    const unitEl=document.getElementById('pf_unit');
    if(unitEl&&!unitEl.dataset.bound){
      unitEl.dataset.bound='1';
      combo(unitEl,DB.units.filter(u=>u.roles.includes('供应商')).map(u=>({id:u.id,label:u.name,tag:{text:u.rating,cls:u.rating==='主力'?'ok':(u.rating==='新客'?'warn':'gray')}})),opt=>{unitEl.dataset.val=opt.id||'';filterPrices();},'全部供应商',true);
    }
    SPEC_FIELDS.forEach(k=>{
      const el=document.getElementById('pf_'+k);
      if(el&&!el.dataset.bound){
        el.dataset.bound='1';
        combo(el,(DB.specs[k]||[]).map(v=>({id:v,label:v})),opt=>{el.dataset.val=opt.id||'';filterPrices();},SPEC_LABELS[k],true);
      }
    });
    return;
  }
  // BOM管理页：绑定筛选 combo
  if(view==='bom'){
    SPEC_FIELDS.forEach(k=>{
      const el=document.getElementById('bf_'+k);
      if(el&&!el.dataset.bound){
        el.dataset.bound='1';
        combo(el,(DB.specs[k]||[]).map(v=>({id:v,label:v})),opt=>{el.dataset.val=opt.id||'';filterBOM();},SPEC_LABELS[k],true);
      }
    });
    return;
  }
  // 订单编辑页：绑定采购商 combo
  if(view==='orders'&&curOrder){
    const buyerEl=document.getElementById('tf_buyer');
    if(buyerEl&&!buyerEl.dataset.bound){
      buyerEl.dataset.bound='1';
      combo(buyerEl,DB.units.filter(u=>u.roles.includes('采购商')).map(u=>({id:u.id,label:u.name,tag:{text:u.rating,cls:u.rating==='主力'?'ok':(u.rating==='新客'?'warn':'gray')}})),
        opt=>{
          buyerEl.dataset.val=opt.id;
          const u=DB.units.find(x=>x.id===opt.id);
          const contacts=u?(u.contacts||[]).filter(c=>c.side==='采购商'||(c.sides&&c.sides.includes('采购'))):[];
          document.getElementById('tf_contact').innerHTML=contacts.length
            ?contacts.map(c=>'<option value="'+escAttr(c.name)+'">'+escHtml(c.name)+'('+escHtml(c.phone)+')</option>').join('')
            :'<option value="">(无联系人)</option>';
        },'搜索或直接输入采购商...',true);
      // 如果有已选采购商，回填联系人
      const bid=buyerEl.dataset.val;
      if(bid){
        const u=DB.units.find(x=>x.id===bid);
        const o=_fMode==='edit'?DB.orders.find(x=>x.id===_fOrderId):null;
        const contacts=u?(u.contacts||[]).filter(c=>c.side==='采购商'||(c.sides&&c.sides.includes('采购'))):[];
        const cEl=document.getElementById('tf_contact');
        if(cEl){
          cEl.innerHTML=contacts.length
            ?contacts.map(c=>'<option value="'+escAttr(c.name)+'"'+(o&&o.buyerContact===c.name?' selected':'')+'>'+escHtml(c.name)+'('+escHtml(c.phone)+')</option>').join('')
            :'<option value="">(无联系人)</option>';
        }
      }
    }
  }
}
